name: Build & Upload to Google Play

on:
  push:
    branches: [main]
    paths:
      - 'cacree/**'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track (internal / alpha / beta / production)'
        required: true
        default: 'internal'

env:
  JAVA_VERSION: '17'

jobs:
  build-and-upload:
    name: Build Release AAB & Upload
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('cacree/**/*.gradle*', 'cacree/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > cacree/cacree-release.jks

      - name: Create keystore.properties
        run: |
          cat > cacree/keystore.properties << EOF
          storeFile=../cacree-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x cacree/gradlew

      - name: Build release AAB
        working-directory: cacree
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: cacree-release-aab
          path: cacree/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cacree.financialarchitect
          releaseFiles: cacree/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          releaseName: v6.7.${{ github.run_number }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f cacree/cacree-release.jks
          rm -f cacree/keystore.properties
